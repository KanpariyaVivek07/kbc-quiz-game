<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="quiz.css">

</head>

<body>
    <video src="MainBack-ground.mp4" autoplay muted loop></video>
    <main class="main">

        <header class="header">
            <a href="#" class="logo">Quiz.</a>
            <nav class="navbar">
                <a href="quiz.html" class="active">Home</a>
                <a href="about_us.html">About</a>
                <!-- <a href="#">Services</a> -->
                <!-- <a href="#">Contact</a> -->
            </nav>
        </header>

        <section class="home">
            <div class="home-content">
                <h1>Wel-Come to Quiz Word!</h1>
                <button class="start-btn">
                    S T A R T
                    <div id="clip">
                        <div id="leftTop" class="corner"></div>
                        <div id="rightBottom" class="corner"></div>
                        <div id="rightTop" class="corner"></div>
                        <div id="leftBottom" class="corner"></div>
                    </div>
                    <span id="rightArrow" class="arrow"></span>
                    <span id="leftArrow" class="arrow"></span>
                </button>
            </div>
        </section>
    </main>

    <div class="popup-info">
        <h2>Quiz Guide</h2>
        <span class="info">1. Please Enter Your Details First</span>
        <span class="info">2. Select Language for Play Quiz</span><br>
        <span class="info">3. Please Select Your Answer in Given Time</span>
        <span class="info">4. 10 Questions Show One by One</span>
        <span class="info">5. When you Click on Next At that time Show Anohter Question</span>

        <div class="btn-group">
            <button class="btn-53">
                <div class="original">Exit Quiz</div>
                <div class="letters">

                    <span>E</span>
                    <span>X</span>
                    <span>I</span>
                    <span>T</span>
                    <span>&nbsp;</span>
                    <span>Q</span>
                    <span>U</span>
                    <span>I</span>
                    <span>Z</span>
                </div>
                <!-- <audio src="Bas Hawa Nikal Gayi Meme Template.mp3" id="audio"></audio> -->
            </button>
            <button class="btn-54" onclick="login()">
                <div class="original">Continue</div>
                <div class="letters">

                    <span>C</span>
                    <span>O</span>
                    <span>N</span>
                    <span>T</span>
                    <span>I</span>
                    <span>N</span>
                    <span>U</span>
                    <span>E</span>

                </div>
            </button>
        </div>
    </div>

    <script src="quiz.js"></script>
</body>

</html>
